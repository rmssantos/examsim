name: Validate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Python quality tools
        run: python -m pip install ruff==0.15.2

      - name: Install browser smoke dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Lint Python
        run: ruff check .

      - name: Compile Python tools
        run: python -m py_compile server.py tools/build_pages_artifact.py tools/generate-exam-data-js.py tools/generate-exam-pages.py tools/inject-analytics-secret.py tools/validate-exam-packs.py

      - name: Check JavaScript syntax
        run: |
          node --check service-worker.js
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate exam packs
        run: python tools/validate-exam-packs.py --root user-content/exams

      - name: Check pack manifests (SHA-256 integrity)
        run: python tools/validate-exam-packs.py --root user-content/exams --check-manifest

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Build public Pages artifact
        run: python tools/build_pages_artifact.py --output _site

      - name: Run browser smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/examplar-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              break
            fi
            sleep 0.25
          done
          npm run test:browser
